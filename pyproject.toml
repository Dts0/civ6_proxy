[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civ6relay"
version = "0.1.0"
description = "Civilization VI room-scoped UDP relay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
client = [
    "psutil>=5.9",
    "pydivert==3.1.3; sys_platform == 'win32'",
]
dev = [
    "ruff==0.15.22",
]

[project.scripts]
civ6-relay-server = "civ6relay.server:main"

[project.gui-scripts]
civ6-relay-client = "civ6relay.gui:main"

[tool.setuptools.packages.find]
include = ["civ6relay*"]
