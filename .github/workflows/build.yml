name: Test and build

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  windows:
    name: Build Windows x64 client
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build client and check bundled files
        shell: pwsh
        run: ./build_client.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Civ6RelayClient-windows-x64
          path: dist/Civ6RelayClient-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Build Linux x64 client (packaging only)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and archive client
        run: |
          python -m pip install -r requirements-client.txt
          python -c "import tkinter"
          python -m PyInstaller --clean --noconfirm Civ6RelayClient.spec
          tar -C dist -czf dist/Civ6RelayClient-linux-x64.tar.gz Civ6RelayClient
      - name: Check archived client starts and reports platform support
        run: |
          tar -C "$RUNNER_TEMP" -xzf dist/Civ6RelayClient-linux-x64.tar.gz
          status=0
          output=$("$RUNNER_TEMP/Civ6RelayClient/Civ6RelayClient" 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fxq 'Civ6RelayClient only supports Windows' <<< "$output"
      - uses: actions/upload-artifact@v7
        with:
          name: Civ6RelayClient-linux-x64
          path: dist/Civ6RelayClient-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attach packages to version release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Civ6RelayClient-*
          path: packages
          merge-multiple: true
      - name: Publish archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(packages/Civ6RelayClient-windows-x64.zip packages/Civ6RelayClient-linux-x64.tar.gz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --generate-notes \
              --notes 'Windows x64 为可联机的玩家客户端。Linux x64 为构建验证包，游戏网络适配尚未移植。'
          fi
